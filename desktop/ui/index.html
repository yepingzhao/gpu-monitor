<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GPU Monitor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header>
    <h1>GPU Monitor <span>服务器</span></h1>
    <nav id="toolbar-actions" aria-label="操作"></nav>
  </header>
  <main>
    <section class="toolbar" aria-label="监控概况">
      <label class="search"><span class="sr-only">筛选服务器</span><input id="search" type="search" placeholder="筛选服务器…" aria-label="筛选服务器"></label>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="servers" aria-label="服务器列表"></div>
  </main>
  <footer><span id="overview" role="status">正在读取服务器…</span><span id="interval"></span><span title="关闭主窗口后继续监控。单击托盘图标快速查看，双击或右键菜单打开主窗口。">后台托盘运行</span></footer>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <h2 id="settings-title">监控设置</h2>
      <p class="muted">从 SSH 配置读取服务器，修改后自动同步。</p>
      <code id="config-path"></code>
      <button id="open-config" type="button">打开 SSH 配置</button>
      <div class="fields">
        <label>刷新间隔 <span><output id="refresh-value">30</output> 秒</span><input name="refreshInterval" type="range" min="5" max="300" step="5" required></label>
        <label>连接超时（秒）<input name="connectionTimeout" type="number" min="3" max="300" required></label>
      </div>
      <div class="settings-servers-title"><h3>监控服务器</h3><div><button id="select-all" type="button">全选</button><button id="select-none" type="button">全不选</button></div></div>
      <p class="muted">自动读取 SSH 配置，取消勾选可跳过对应服务器。</p>
      <div id="settings-servers" class="settings-servers"></div>
      <p class="muted">密钥认证支持系统 OpenSSH 的 ProxyJump 和 ssh-agent。密码认证使用直接 SSH 连接。</p>
      <p id="settings-error" class="error" role="alert"></p>
      <div class="actions"><button type="button" data-close="settings-dialog">取消</button><button type="submit" class="primary">保存设置</button></div>
    </form>
  </dialog>
  <dialog id="password-dialog" aria-labelledby="password-title">
    <form id="password-form">
      <h2 id="password-title">SSH 密码</h2>
      <p id="password-host"></p>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <p class="muted">密码通过 Windows 系统加密后保存在当前用户的应用数据目录。</p>
      <p id="password-error" class="error" role="alert"></p>
      <div class="actions"><button type="button" data-close="password-dialog">取消</button><button type="submit" class="primary">保存并连接</button></div>
    </form>
  </dialog>
</body>
</html>
